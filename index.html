        // ============= CÁLCULO DA FLECHA (Fig. 5-10) =============
        function gerarPainelFlecha(arm) {
            const { fck, bw, h, d, AsFinal: As } = arm;
            const L_m  = resultados.comprimentoViga;
            const L    = L_m * 100;                          // cm
            const apoE = document.getElementById('apoioEsq').value;
            const apoD = document.getElementById('apoioDir').value;
            const uni  = resultados.unidade;

            // ── Módulo de elasticidade (NBR 6118 item 8.2.8) ─────────────────────
            const Eci_MPa = 5600 * Math.sqrt(fck);
            const Ecs_MPa = 0.85 * Eci_MPa;
            const E       = Ecs_MPa / 10;                    // kN/cm²

            // ── Momentos de inércia ───────────────────────────────────────────────
            const Ig = bw * Math.pow(h, 3) / 12;            // cm⁴

            // Linha neutra e Inércia da seção fissurada (estádio II)
            const alphaE = 210000 / Ecs_MPa;                 // αe = Es/Ecs
            const A_c = bw / 2, B_c = alphaE * As, C_c = -alphaE * As * d;
            const xII = (-B_c + Math.sqrt(B_c*B_c - 4*A_c*C_c)) / (2*A_c);
            const I2  = bw * Math.pow(xII,3)/3 + alphaE * As * Math.pow(d-xII, 2);

            // ── Momento de fissuração (ELS: fctk,inf) ────────────────────────────
            const fctm       = 0.30 * Math.pow(fck, 2/3);   // MPa
            const fctk_inf   = 0.7  * fctm;                  // MPa
            const Mr         = 1.5  * (fctk_inf/10) * Ig / (h/2); // kN.cm

            // ── Momento de serviço (Mk) ───────────────────────────────────────────
            let Md_kNcm = resultados.Mmax * 100;
            if (resultados.unidade === 'tf') Md_kNcm *= 9.81;
            const Mk = Md_kNcm / 1.4;                        // kN.cm (γf ≈ 1,4)

            // ── Ie (Branson) ──────────────────────────────────────────────────────
            const fissurada = Mk > Mr;
            let Ie;
            if (!fissurada) {
                Ie = Ig;
            } else {
                const r = Mr / Mk;
                Ie = Math.pow(r,3)*Ig + (1 - Math.pow(r,3))*I2;
            }
            const EI = E * Ie;

            // ── Identificar configuração ─────────────────────────────────────────
            const ehBiap  = apoE==='apoio'     && apoD==='apoio';
            const ehCons  = (apoE==='engastado' && apoD==='livre') || (apoE==='livre' && apoD==='engastado');
            const ehFF    = apoE==='engastado' && apoD==='engastado';
            const ehFA    = (apoE==='engastado' && apoD==='apoio') || (apoE==='apoio' && apoD==='engastado');
            const configLabel = ehBiap?'Simplesmente Apoiada': ehCons?'Console (Balanço)':
                                ehFF  ?'Biengastada'         : ehFA  ?'Engastada-Apoiada':'—';

            // ── Superposição das cargas ───────────────────────────────────────────
            let f_total_cm = 0;
            const detalhes = [];

            cargas.forEach(carga => {
                let fi = 0, formula = '';

                if (carga.tipo === 'distribuida') {
                    const w  = carga.valor / 100;             // kN/m → kN/cm
                    const a1 = (carga.inicio ?? 0) * 100;
                    const a2 = (carga.fim    ?? L_m) * 100;
                    const len = a2 - a1;
                    const fullSpan = Math.abs(len - L) < 1;

                    if (ehBiap) {
                        fi = fullSpan
                            ? 5*w*Math.pow(L,4)/(384*EI)
                            : 5*w*Math.pow(len,4)/(384*EI)*(len/L);
                        formula = fullSpan ? 'f = 5pℓ⁴/(384EI)' : 'f ≈ 5p·a⁴/(384EI)·(a/L)  [parcial]';
                    } else if (ehCons) {
                        fi = w*Math.pow(L,4)/(8*EI);
                        formula = 'f = pℓ⁴/(8EI)';
                    } else if (ehFF) {
                        fi = w*Math.pow(L,4)/(384*EI);
                        formula = 'f = pℓ⁴/(384EI)';
                    } else if (ehFA) {
                        fi = 2*w*Math.pow(L,4)/(384*EI); // ≈ valor intermediário
                        formula = 'f ≈ 2pℓ⁴/(384EI)';
                    }
                    if (fi > 0) detalhes.push({ label:`q=${carga.valor} ${uni}/m`, formula, fi });

                } else { // pontual
                    const P = carga.valor;
                    const a = carga.posicao * 100;
                    const b = L - a;
                    const aa = Math.min(a,b);

                    if (ehBiap) {
                        if (Math.abs(a - L/2) < 1) {
                            fi = P*Math.pow(L,3)/(48*EI);
                            formula = 'f = Pℓ³/(48EI)  [central]';
                        } else {
                            // Fig 5-10: Pa(ℓ²-a²)^(3/2) / (9√3·EI·ℓ)
                            fi = P*aa*Math.pow(L*L-aa*aa, 1.5) / (9*Math.sqrt(3)*EI*L);
                            formula = 'f = Pa(ℓ²-a²)^(3/2)/(9√3·EI·ℓ)';
                        }
                    } else if (ehCons) {
                        fi = P*Math.pow(L,3)/(3*EI);
                        formula = 'f = Pℓ³/(3EI)';
                    } else if (ehFF) {
                        // deflexão no ponto de aplicação: Pa³b³/(3EIL³)
                        fi = P*Math.pow(aa,3)*Math.pow(L-aa,3)/(3*EI*Math.pow(L,3));
                        formula = 'f = Pa³b³/(3EIL³)';
                    } else if (ehFA) {
                        fi = P*Math.pow(aa,2)*Math.pow(b,2)/(3*EI*L);
                        formula = 'f ≈ Pa²b²/(3EIL)  [misto]';
                    }
                    if (fi > 0) detalhes.push({ label:`P=${P} ${uni} a ${carga.posicao}m`, formula, fi });
                }
                f_total_cm += fi;
            });

            const f_mm = f_total_cm * 10;                    // cm → mm
            const lim_L250 = L_m*1000/250;
            const lim_L350 = L_m*1000/350;
            const lim_L500 = L_m*1000/500;
            const ok250 = f_mm <= lim_L250;
            const ok350 = f_mm <= lim_L350;

            return `
            <div class="panel">
                <h3>📉 Verificação da Flecha — ELS (NBR 6118 item 17.3)</h3>

                <div style="background:rgba(30,41,59,0.6); padding:18px 24px; border-radius:8px; margin-bottom:20px;
                            border:1px solid rgba(100,116,139,0.3); font-family:'JetBrains Mono',monospace;
                            font-size:13px; color:#94a3b8; line-height:2.2;">
                    <div style="color:#cbd5e1; font-weight:700; font-size:14px; margin-bottom:10px;">Parâmetros de rigidez EI:</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 32px;">
                        <div>Eci = 5600·√${fck} = <strong style="color:#e2e8f0;">${Eci_MPa.toFixed(0)} MPa</strong></div>
                        <div>Ecs = 0,85·Eci &nbsp;= <strong style="color:#e2e8f0;">${Ecs_MPa.toFixed(0)} MPa = ${E.toFixed(2)} kN/cm²</strong></div>
                        <div>Ig = ${bw}·${h}³/12 &nbsp;= <strong style="color:#e2e8f0;">${Ig.toFixed(0)} cm⁴</strong></div>
                        <div>αe = Es/Ecs &nbsp;&nbsp;&nbsp;&nbsp;= <strong style="color:#e2e8f0;">${alphaE.toFixed(2)}</strong></div>
                        <div>x<sub>II</sub> &nbsp;= <strong style="color:#e2e8f0;">${xII.toFixed(2)} cm</strong> (L.N. fissurada)</div>
                        <div>I<sub>II</sub> &nbsp;&nbsp;= <strong style="color:#e2e8f0;">${I2.toFixed(0)} cm⁴</strong></div>
                        <div>Mr = 1,5·fctk,inf·Ig/yt = <strong style="color:#a78bfa;">${(Mr/100).toFixed(2)} kN.m</strong></div>
                        <div>Mk ≈ Md/1,4 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <strong style="color:${fissurada?'#ef4444':'#10b981'};">${(Mk/100).toFixed(2)} kN.m ${fissurada?'⚠ fissurada':'✔ íntegra'}</strong></div>
                        <div>Ie (Branson) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <strong style="color:#e2e8f0;">${Ie.toFixed(0)} cm⁴ &nbsp;(${(Ie/Ig*100).toFixed(0)}% de Ig)</strong></div>
                        <div>EI &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <strong style="color:#e2e8f0;">${(EI/1e6).toFixed(2)}×10⁶ kN.cm²</strong></div>
                    </div>
                </div>

                <div style="margin-bottom:20px;">
                    <div style="font-size:14px; font-weight:700; color:#cbd5e1; margin-bottom:12px;">
                        Esquema: <span style="color:#60a5fa;">${configLabel}</span>
                        &nbsp;|&nbsp; L = ${L_m} m
                    </div>
                    <table style="width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:12px;">
                        <thead>
                            <tr style="background:rgba(59,130,246,0.2); border-bottom:2px solid #3b82f6;">
                                <th style="padding:9px 12px; text-align:left; color:#cbd5e1;">Carga</th>
                                <th style="padding:9px 12px; text-align:left; color:#cbd5e1;">Fórmula (Fig. 5-10)</th>
                                <th style="padding:9px 12px; text-align:right; color:#cbd5e1;">f (mm)</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${detalhes.map(det=>`
                            <tr style="border-bottom:1px solid rgba(100,116,139,0.2); background:rgba(30,41,59,0.3);">
                                <td style="padding:9px 12px; color:#e2e8f0;">${det.label}</td>
                                <td style="padding:9px 12px; color:#94a3b8;">${det.formula}</td>
                                <td style="padding:9px 12px; text-align:right; color:#f59e0b; font-weight:600;">${(det.fi*10).toFixed(3)}</td>
                            </tr>`).join('')}
                            <tr style="background:rgba(59,130,246,0.1); border-top:2px solid #3b82f6;">
                                <td colspan="2" style="padding:10px 12px; color:#cbd5e1; font-weight:700;">TOTAL (superposição)</td>
                                <td style="padding:10px 12px; text-align:right; color:${ok250?'#10b981':'#ef4444'}; font-size:16px; font-weight:800;">${f_mm.toFixed(3)} mm</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:14px; margin-bottom:16px;">
                    <div style="padding:16px; border-radius:10px; text-align:center;
                                border:2px solid rgba(99,102,241,0.4); background:rgba(99,102,241,0.1);">
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">Flecha imediata</div>
                        <div style="font-size:28px; font-weight:800; font-family:'JetBrains Mono',monospace; color:#818cf8;">${f_mm.toFixed(2)}</div>
                        <div style="font-size:11px; color:#64748b;">mm</div>
                    </div>
                    <div style="padding:16px; border-radius:10px; text-align:center;
                                border:2px solid ${ok250?'rgba(16,185,129,0.4)':'rgba(239,68,68,0.4)'};
                                background:${ok250?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)'};">
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">L/250 = ${lim_L250.toFixed(1)} mm</div>
                        <div style="font-size:24px; font-weight:800; font-family:'JetBrains Mono',monospace; color:${ok250?'#10b981':'#ef4444'};">${ok250?'✔ OK':'✗'}</div>
                        <div style="font-size:11px; color:${ok250?'#10b981':'#ef4444'};">flecha total</div>
                    </div>
                    <div style="padding:16px; border-radius:10px; text-align:center;
                                border:2px solid ${ok350?'rgba(16,185,129,0.4)':'rgba(239,68,68,0.4)'};
                                background:${ok350?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)'};">
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">L/350 = ${lim_L350.toFixed(1)} mm</div>
                        <div style="font-size:24px; font-weight:800; font-family:'JetBrains Mono',monospace; color:${ok350?'#10b981':'#ef4444'};">${ok350?'✔ OK':'✗'}</div>
                        <div style="font-size:11px; color:${ok350?'#10b981':'#ef4444'};">flecha ativa</div>
                    </div>
                    <div style="padding:16px; border-radius:10px; text-align:center;
                                border:2px solid rgba(100,116,139,0.3); background:rgba(30,41,59,0.5);">
                        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">L/500 = ${lim_L500.toFixed(1)} mm</div>
                        <div style="font-size:20px; font-weight:800; font-family:'JetBrains Mono',monospace; color:${f_mm<=lim_L500?'#10b981':'#64748b'};">${f_mm<=lim_L500?'✔ OK':'—'}</div>
                        <div style="font-size:11px; color:#64748b;">com alvenaria</div>
                    </div>
                </div>

                <div style="padding:12px 16px; background:rgba(139,92,246,0.08); border-left:4px solid #7c3aed;
                            border-radius:4px; font-size:12px; color:#94a3b8; line-height:1.8;">
                    <strong style="color:#a78bfa;">NBR 6118 item 13.3:</strong>
                    L/250 = flecha total pós-construção (aceitabilidade sensorial) ·
                    L/350 = parcela ativa após instalação de elementos não estruturais ·
                    L/500 = risco de dano em paredes de alvenaria.<br>
                    <span style="color:#64748b; font-size:11px;">Ie pelo método de Branson (NBR item 17.3.2). Não considera fluência (φ∞). Para flecha total de longa duração multiplicar pela expressão: f_tot = f_imediata · (1 + αf), onde αf depende da taxa de armadura comprimida e φ∞.</span>
                </div>
            </div>
            `;
        }
        const calcularOriginal = calcular;
        calcular = function() {
            calcularOriginal();
            if (resultados) {
                atualizarDmin();
                renderizarArmadura();
            }
        };
    
    </script>
</body>
</html>
